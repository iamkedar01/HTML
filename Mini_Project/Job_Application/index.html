<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application </title>
    <link rel="stylesheet" href="style.css" >

</head>
<body> 
    <div class="container">
        <div class="apply_box">

            <h1>Job Application
            <span class="title_small">(web)</span>
             </h1>

             <form action="">
                <div class="form_container">
                <div class="form_contorl">
                    <label for="First_Name"> First Name</label>
                    <input id="first_name" name="first_name" placeholder="Enter First name.." required >
                </div>

                <div class="form_contorl">
                    <label for="last_Name"> Last Name</label>
                    <input id="last_name" name="last_name" placeholder="Enter Last name.." required >
                </div>

                <div class="form_contorl">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter Email" required >
                </div>

                <div class="form_contorl">
                    <label for="job_role"> Job Role</label>
                   <select id="job_role" name="job_role" required>
                    <option value=" ">Select Job </option>
                    <option value="fullstack_devlopment">FullStack Devlopment </option>
                    <option value="frontend">Frontend </option>
                    <option value="backend">Backend </option>
                    <option value="React">React</option>
                    <option value="Node">Node.js </option>
                   </select>
                </div>
                <div class="textarea_control">
                    <label for="address">Address</label>
                    <textarea 
                    id="address"
                     name="address" 
                    rows="4" 
                    cols="50" 
                    placeholder="Enter your address"
                    required></textarea>
                </div>
                <div class="form_contorl">
                    <label for="city">City</label>
                    <input id="city" name="city" placeholder="Enter city name" required >
                </div>
                <div class="form_contorl">
                    <label for="pincode">pin_code</label>
                    <input type="number" id="pincode" name="pincode" placeholder="Enter Pincode here " required >
                </div>
                <div class="form_contorl">
                    <label for="date">D.O.B</label>
                    <input value="1947-05-25" type="date" id="date" name="date"  required >
                </div>
                <div class="form_contorl">
                    <label for="upload"> Upload Your Resume/CV</label>
                    <input type="file" id="upload" name="upload" requried>

                </div>
                </div>
                <div class="button_container">
                    <button type="submit">Apply Now</button>

                </div>
             </form>
        </div>
    </div>
    
</body>
</html>
