<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form in html</title>
</head>
<body>
    <h1>HTML - Form</h1>

    <form>
        First Name: <input type="text" name="First name" placeholder="Enter a First name">
        <br>
        <br>
        Last Name: <input type="text" name="Last name" placeholder="Enter a Last name">
        <br>
        <br>
        Gender:
        <input type="radio" name="Male">Male
        <input type="radio" name="Female">Female
        <br>
        <br>
        Password: <input type="password" name="password" maxlength="8" minlength="4">
        <br>
        <br>

        feedback:<br>
        <textarea rows="5" cols="50" placeholder="Enter a the feedback" > </textarea>
        <br>
        <br>
        <input type="button" value="Submit">

    </form>
    
</body>
</html>
